services:
  share-data:
    # 直接使用本地已 load 的镜像（打包脚本会写入实际标签）
    image: share-data:amd64
    pull_policy: never
    container_name: share-data-app
    restart: always
    ports:
      - "8000:8000"

    # 线上秘钥文件（服务器本地文件，不进镜像）
    env_file:
      - .env

    environment:
      - STATIC_ROOT=/app/static
      - PORT=8000
      - CORS_ORIGINS=*
      - SANDBOX_URL=http://sandbox-controller:8090
      - SANDBOX_TOKEN=${SANDBOX_TOKEN:?SANDBOX_TOKEN must be set to at least 32 bytes}

    depends_on:
      sandbox-controller:
        condition: service_healthy

  monitor-worker:
    # 与主应用复用同一镜像；交易时段轮询盯盘任务并发邮件。
    image: share-data:amd64
    pull_policy: never
    container_name: share-data-monitor-worker
    restart: always

    environment:
      - APP_ENV=${APP_ENV:-production}
      - MONGODB_URI=${MONGODB_URI:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN:-}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-}
      - MAIL_USER=${MAIL_USER:-}
      - MAIL_PASS=${MAIL_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}

    command:
      - python
      - -m
      - app.advisor.monitor.worker

  sandbox-controller:
    image: share-data-sandbox-controller:amd64
    pull_policy: never
    container_name: share-data-sandbox-controller
    restart: always

    environment:
      - SANDBOX_TOKEN=${SANDBOX_TOKEN:?SANDBOX_TOKEN must be set to at least 32 bytes}
      - SANDBOX_RUNNER_IMAGE=share-data-python-sandbox:amd64

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    expose:
      - "8090"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')
      interval: 30s
      timeout: 5s
      retries: 3
